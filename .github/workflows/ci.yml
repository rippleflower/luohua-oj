name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oj/shared test
      - run: pnpm --filter @oj/web test
      - run: pnpm --filter @oj/web build
      - run: go test ./apps/api/... ./apps/judge-worker/...
